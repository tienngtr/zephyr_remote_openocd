[pytest]
testpaths =
    tests/unit
    tests/local_integration
pythonpath =
    python
    .
addopts = -ra
markers =
    unit: self-contained tests without external processes or hardware
    local: local process, socket, helper, or signal integration
    zephyr: requires a Zephyr source tree and toolchain
    ssh: requires a configured remote Linux host
    hardware: destructive test using a physical target
    release: release-validation-only test or benchmark
    destructive: may alter a physical target or remote workspace
