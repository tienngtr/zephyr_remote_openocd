[mypy]
python_version = 3.12
mypy_path = python
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True
# Every checked module must annotate its functions: product lifecycle,
# protocol, and cleanup code, and equally the tests, harnesses, and fixture
# programs that validate it. Unannotated parameters and results silently
# become Any. Applying this globally does not depend on how mypy names the
# test directories that have no __init__.py.
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Zephyr's runner package is available only inside a Zephyr environment; the
# Zephyr integration job resolves it with MYPYPATH (docs/development/testing.md).
[mypy-runners.*]
ignore_missing_imports = True

[mypy-zephyr_ext_common]
ignore_missing_imports = True
