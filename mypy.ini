[mypy]
python_version = 3.12
mypy_path = python
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True

# Product modules are the static contract for lifecycle, protocol, and cleanup
# code; unannotated parameters and results would silently become Any there.
[mypy-zephyr_remote_openocd.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Zephyr's runner package is available only inside a Zephyr environment; the
# Zephyr integration job resolves it with MYPYPATH (docs/development/testing.md).
[mypy-runners.*]
ignore_missing_imports = True

# Installed without bundled annotations or repository-required stub packages.
[mypy-yaml.*,jsonschema.*]
ignore_missing_imports = True
