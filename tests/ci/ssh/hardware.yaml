# Transport-only inventory for the isolated SSH server used in CI.
build_environments:
  ci:
    zephyr_base: /unused/zephyr
    west: /unused/west

hosts:
  ci:
    ssh_host: ci-ssh
    ssh_command: [ssh, -F, tests/ci/ssh/ssh_config]
    openocd_command: [/usr/bin/openocd]

targets:
  ci_placeholder:
    host: ci
    build_environment: ci
    board: ci_transport_only
    builds:
      unused:
        application: ci_transport_only
    # The schema requires an operation; transport tests do not use it.
    profiles:
      inventory_schema:
        build: unused
        operations:
          debug:
            breakpoint: main
