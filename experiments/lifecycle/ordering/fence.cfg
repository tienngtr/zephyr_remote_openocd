SPECIFICATION Spec
CONSTANTS
    Design = "fence"
    EffectPolicy = "validated"
    RetrySettlement = "strict"
    Focus = "all"
    TailFacts = {"STOP", "EOF", "BAD"}
    MaxGeneration = 2
    InterruptEnabled = TRUE
    ResourceNames = {"child", "aux"}
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoReadyAfterTerminal
    NoRetryAfterTerminal
    NoObservedReadyOvertake
    NoObservedRetryOvertake
    NoStaleSuccess
    ResourceOwned
    NoStaleAdoption
    OneTerminalOutput
    NoOutputAfterTerminal
    PrimaryPreserved
    DiagnosticsRetained
    RecognizedFailuresRetained
    NoDuplicatePrimaryDiagnostic
    NoForbiddenAuthorization
    NoInvalidExecution
    RetryAfterSettlement
    ClosedSettled
