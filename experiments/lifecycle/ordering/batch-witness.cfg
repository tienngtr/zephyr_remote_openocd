SPECIFICATION Spec
CONSTANTS
    Design = "atomic"
    EffectPolicy = "validated"
    RetrySettlement = "strict"
    Focus = "all"
    TailFacts = {"STOP"}
    MaxGeneration = 2
    InterruptEnabled = FALSE
    ResourceNames = {"child", "aux"}
CHECK_DEADLOCK FALSE
INVARIANTS
    NoBatchWitness
