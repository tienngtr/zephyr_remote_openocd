SPECIFICATION Spec
CONSTANTS
    ChannelDesign = "separate"
    AdmissionRule = "atomic"
    Mutant = "none"
    MaxGeneration = 1
    Capacity = 1
    BulkLimit = 1
    ExtraSource = TRUE
    TailFacts = {"STOP", "EOF", "BAD"}
    Focus = "all"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoObservedReadyOvertake
    NoObservedRetryOvertake
    NoPrematureBarrierAck
    NoBarrierCycle
    ResourceOwned
    ExclusiveCleanup
    NoStaleTransfer
    RetrySettled
    NoFalseSettlement
    NoInvalidExecution
    SpawnHasAdmission
    OneTerminalOutput
    NoOutputAfterTerminal
    OrderedOutput
    PrimaryPreserved
    AllErrorsRetained
    WriterDiagnosticOwned
    ResidualOwned
    NoDuplicatePrimary
    ClosedSettled
