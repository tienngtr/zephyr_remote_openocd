SPECIFICATION NoAdmissionFairSpec
CONSTANTS
    ChannelDesign = "shared"
    AdmissionRule = "fence"
    Mutant = "none"
    MaxGeneration = 1
    Capacity = 1
    BulkLimit = 0
    ExtraSource = FALSE
    TailFacts = {"STOP", "EOF", "BAD"}
    Focus = "all"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoObservedReadyOvertake
    NoObservedRetryOvertake
    NoPrematureBarrierAck
    NoBarrierCycle
    ResourceOwned
    ExclusiveCleanup
    NoStaleTransfer
    RetrySettled
    NoFalseSettlement
    NoInvalidExecution
    SpawnHasAdmission
    OneTerminalOutput
    NoOutputAfterTerminal
    OrderedOutput
    PrimaryPreserved
    AllErrorsRetained
    WriterDiagnosticOwned
    ResidualOwned
    NoDuplicatePrimary
    ClosedSettled
PROPERTIES
    TerminationCloses
