SPECIFICATION FairSpec
CONSTANTS
    ChannelDesign = "separate"
    AdmissionRule = "fence"
    Mutant = "none"
    MaxGeneration = 2
    Capacity = 1
    BulkLimit = 0
    ExtraSource = FALSE
    TailFacts = {"STOP"}
    Focus = "retry"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoObservedReadyOvertake
    NoObservedRetryOvertake
    NoPrematureBarrierAck
    NoBarrierCycle
    ResourceOwned
    ExclusiveCleanup
    NoStaleTransfer
    RetrySettled
    NoFalseSettlement
    NoInvalidExecution
    SpawnHasAdmission
    OneTerminalOutput
    NoOutputAfterTerminal
    OrderedOutput
    PrimaryPreserved
    AllErrorsRetained
    WriterDiagnosticOwned
    ResidualOwned
    NoDuplicatePrimary
    ClosedSettled
PROPERTIES
    TerminationCloses
    BarrierProgress
    TerminalMonotonic
