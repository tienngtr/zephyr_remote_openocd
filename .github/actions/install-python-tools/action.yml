name: Install Python and developer PyPI packages
description: Set up Python and install repository developer pip packages
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements_dev.txt
    - name: Install developer pip packages
      shell: bash
      run: python -m pip install -r requirements_dev.txt
