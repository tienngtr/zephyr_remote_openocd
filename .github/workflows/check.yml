name: checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run self-contained tests
        run: pytest
      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check static compatibility
        run: |
          files=$(git ls-files '*.py')
          pylint --rcfile=pylintrc $files
          vermin -p=1 -f parsable --violations -t=3.12- --no-make-paths-absolute $files
