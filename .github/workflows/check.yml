name: checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install developer tools
        run: python -m pip install -r requirements_dev.txt
      - name: Report tip code complexity metrics
        if: github.event_name == 'push'
        run: >-
          python scripts/radon_summary.py --revision "${{ github.sha }}"
          --output "${GITHUB_STEP_SUMMARY}"
      - name: Report pull request code complexity changes
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/radon_summary.py
          --base-revision "${{ github.event.pull_request.base.sha }}"
          --revision "${{ github.sha }}"
          --output "${GITHUB_STEP_SUMMARY}"
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          gitlint --fail-without-commits --commits
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          if test "$FORCED" = "true" || \
             test "$BEFORE" = "0000000000000000000000000000000000000000"; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          gitlint --fail-without-commits --commits "$range"
      - name: Run self-contained tests
        run: >-
          pytest --cov --cov-config=.coveragerc --cov-report=
      - name: Check out Zephyr 4.4 runner sources
        uses: actions/checkout@v7
        with:
          repository: zephyrproject-rtos/zephyr
          ref: v4.4.0
          path: .scratch/zephyr
          sparse-checkout: scripts/west_commands
          persist-credentials: false
      - name: Run Zephyr adapter tests
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/.scratch/zephyr
        run: >-
          pytest tests/zephyr_integration/test_adapter.py -m zephyr
          --cov --cov-config=.coveragerc --cov-append
          --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Write coverage summary
        run: >-
          python scripts/coverage_summary.py --revision "${{ github.sha }}"
          --output "${GITHUB_STEP_SUMMARY}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Run static checks
        run: python scripts/static_check.py
