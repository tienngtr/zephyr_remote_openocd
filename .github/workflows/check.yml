name: checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install developer tools
        run: python -m pip install -r requirements_dev.txt
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          gitlint --fail-without-commits --commits
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          if test "$FORCED" = "true" || \
             test "$BEFORE" = "0000000000000000000000000000000000000000"; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          gitlint --fail-without-commits --commits "$range"
      - name: Run self-contained tests
        run: pytest
      - name: Run static checks
        run: python scripts/static_check.py
