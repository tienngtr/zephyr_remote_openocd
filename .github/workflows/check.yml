# SPDX-License-Identifier: Apache-2.0

name: checks

on:
  push:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-python-tools
      - name: Run static checks
        run: python scripts/contributor/static_check.py

  self-contained-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        include:
          # Measure coverage on the minimum supported version, like the
          # external layers; branch arcs differ across interpreter versions.
          - python-version: "3.12"
            coverage: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-python-tools
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run self-contained tests
        if: ${{ !matrix.coverage }}
        run: pytest
      - name: Run self-contained tests with coverage
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_FILE: .coverage.self-contained-tests
        run: pytest --cov --cov-config=.coveragerc --cov-report=
      # Configuration change detection relies on CMake generator behavior, so
      # also exercise it with the minimum CMake version that Zephyr 4.4 supports.
      - name: Run CMake configuration tests with minimum supported CMake
        if: ${{ matrix.coverage }}
        run: |
          python -m venv "$RUNNER_TEMP/cmake-minimum"
          "$RUNNER_TEMP/cmake-minimum/bin/python" -m pip install cmake==3.20.5
          cmake_bin="$("$RUNNER_TEMP/cmake-minimum/bin/python" -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')"
          PATH="$cmake_bin:$PATH" cmake --version
          PATH="$cmake_bin:$PATH" pytest tests/local_integration/test_cmake_configuration.py
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.coverage }}
        with:
          name: coverage-self-contained-tests
          path: .coverage.self-contained-tests
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ssh-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-python-tools
      - name: Create ephemeral SSH credentials
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C zro-github-ci -f ~/.ssh/zro_ci_ed25519
          : > ~/.ssh/zro_ci_known_hosts
      - name: Build SSH server image
        run: docker build -t zro-ci-ssh-server:local tests/ci/ssh_server
      - name: Start SSH server container
        run: |
          public_key="$(cat ~/.ssh/zro_ci_ed25519.pub)"
          docker run -d --name zro-ci-ssh -p 127.0.0.1:22222:22 -e "CI_AUTHORIZED_KEY=$public_key" \
            zro-ci-ssh-server:local
      - name: Wait for authenticated SSH and required remote tools
        run: |
          deadline=$((SECONDS + 120))
          until ssh -F tests/ci/ssh/ssh_config ci-ssh 'python3 --version && openocd --version'; do
            if (( SECONDS >= deadline )); then
              echo 'SSH server or required remote tool did not become ready.' >&2
              exit 1
            fi
            sleep 1
          done
      - name: Run SSH integration suite
        env:
          COVERAGE_FILE: .coverage.ssh-integration
        run: >-
          pytest tests/ssh_integration -m ssh
          --hardware-inventory tests/ci/ssh/hardware.yaml
          --require-external-tests
          --cov --cov-config=.coveragerc --cov-report=
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-ssh-integration
          path: .coverage.ssh-integration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Remove SSH server container
        if: always()
        run: docker rm --force zro-ci-ssh || true

  zephyr-4-4-0-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-zephyr-integration
        with:
          zephyr_ref: v4.4.0
          source_switching: 'true'
          coverage_file: .coverage.zephyr-4-4-0-integration
          coverage_artifact: coverage-zephyr-4-4-0-integration

  zephyr-4-4-branch-integration:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-zephyr-integration
        with:
          zephyr_ref: v4.4-branch

  zephyr-4-5-0-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-zephyr-integration
        with:
          zephyr_ref: v4.5.0
          coverage_file: .coverage.zephyr-4-5-0-integration
          coverage_artifact: coverage-zephyr-4-5-0-integration

  zephyr-4-5-branch-integration:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-zephyr-integration
        with:
          zephyr_ref: v4.5-branch

  coverage:
    needs: [self-contained-tests, ssh-integration, zephyr-4-4-0-integration, zephyr-4-5-0-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install coverage.py
        run: python -m pip install "coverage>=7.10.3"
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: .scratch/coverage
          merge-multiple: true
      - name: Combine coverage data and report
        run: |
          python -m coverage combine .scratch/coverage
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
